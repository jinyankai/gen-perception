# Mask2Former segmentation baseline env (D003: Python 3.11, CUDA 12.8 torch).
# Create with:
#   conda create -n baseline-mask2former python=3.11 -y
#   conda activate baseline-mask2former
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
#   pip install transformers pillow numpy
name: baseline-mask2former
channels: [conda-forge]
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch
      - transformers
      - pillow
      - numpy
