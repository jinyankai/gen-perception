[build-system]
requires = ["setuptools>=75", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "gen-perception"
version = "0.1.0"
description = "Unified generative perception research framework"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
wandb = ["wandb>=0.21,<1"]

[tool.setuptools.packages.find]
include = ["perception_diffusion*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
