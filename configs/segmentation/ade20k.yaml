defaults:
  - ../base/model.yaml

experiment:
  name: ade20k-unified-v1
  seed: 1337
  output_root: "${OUTPUT_ROOT}"

task:
  name: segmentation
  condition: "semantic segmentation"
  codec:
    name: binary_query_mask
    num_classes: 150
    ignore_label: 255
    threshold: 0.5

data:
  dataset: ade20k
  root: "${DATA_ROOT}/ADEChallengeData2016"
  split: training
  validation_split: validation
  image_size: [512, 512]
  num_workers: 8
  horizontal_flip_probability: 0.5
  query_sampling: mixed
  evaluation_query_sampling: fixed
  fixed_query_class_id: 0
  positive_query_probability: 0.5
  drop_last: false

training:
  max_steps: 20000
  batch_size: 2
  mixed_precision: fp16
  gradient_accumulation_steps: 4
  task_batch_homogeneous: true
  optimizer:
    name: adamw
    shared_unet_lr: 1.0e-5
    conditioner_lr: 1.0e-4
    adapter_lr: 1.0e-4
    target_adapter_lr: 1.0e-4

inference:
  scheduler: ddim
  num_steps: 10
  ensemble_size: 1

evaluation:
  protocol: ade20k_semantic_150
  ignore_label: 255
  num_classes: 150
  vocabulary:
    source: ade20k_object_info
    path: "${DATA_ROOT}/ADEChallengeData2016/objectInfo150.txt"
    expected_num_classes: 150
  query:
    mode: closed_set_all_classes
    prompt_template: "segmentation mask of {class_name}"
    batch_size: 8
