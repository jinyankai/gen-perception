defaults:
  - ../base/model.yaml

experiment:
  name: nyuv2-normal-unified-v1
  seed: 1337
  output_root: "${OUTPUT_ROOT}"

task:
  name: normal
  condition: "surface normal estimation"
  codec:
    name: unit_vector
    coordinate_system: camera
    channel_order: xyz
    flip_y: false

data:
  dataset: nyuv2
  root: "${DATA_ROOT}/nyuv2"
  split: train
  validation_split: test
  image_size: [480, 640]
  num_workers: 8
  source: auto
  processed_dir: processed
  depth_field: depths
  horizontal_flip_probability: 0.5
  normal_max_relative_depth_jump: 0.05
  drop_last: false

training:
  max_steps: 20000
  batch_size: 2
  mixed_precision: fp16
  gradient_accumulation_steps: 4
  task_batch_homogeneous: true
  optimizer:
    name: adamw
    shared_unet_lr: 1.0e-5
    conditioner_lr: 1.0e-4
    adapter_lr: 1.0e-4
    target_adapter_lr: 1.0e-4

inference:
  scheduler: ddim
  num_steps: 10
  ensemble_size: 1

evaluation:
  coordinate_system: camera
  channel_order: xyz
  flip_y: false
