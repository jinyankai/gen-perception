defaults:
  - ../base/model.yaml

experiment:
  name: nyuv2-depth-unified-v1
  seed: 1337
  output_root: "${OUTPUT_ROOT}"

task:
  name: depth
  condition: "monocular depth estimation"
  codec:
    name: affine_invariant_depth
    min_depth: 0.1
    max_depth: 10.0

data:
  dataset: nyuv2
  root: "${DATA_ROOT}/nyuv2"
  split: train
  validation_split: test
  image_size: [480, 640]
  num_workers: 8

training:
  max_steps: 20000
  batch_size: 2
  mixed_precision: fp16
  gradient_accumulation_steps: 4
  task_batch_homogeneous: true
  optimizer:
    name: adamw
    shared_unet_lr: 1.0e-5
    conditioner_lr: 1.0e-4
    adapter_lr: 1.0e-4
    target_adapter_lr: 1.0e-4

inference:
  scheduler: ddim
  num_steps: 10
  ensemble_size: 1

evaluation:
  min_depth: 0.1
  max_depth: 10.0
  affine_align: true
