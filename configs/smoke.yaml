defaults:
  - base/model.yaml

experiment:
  name: synthetic-segmentation-smoke
  seed: 1337
  output_root: outputs

task:
  name: segmentation
  condition: "semantic segmentation"
  codec:
    name: palette
    num_classes: 3
    ignore_label: 255

data:
  dataset: synthetic
  root: null
  image_size: [64, 64]
  num_workers: 0

training:
  max_steps: 10
  batch_size: 1
  mixed_precision: "no"
  gradient_accumulation_steps: 1
  task_batch_homogeneous: true
  optimizer:
    name: adamw
    shared_unet_lr: 1.0e-5
    conditioner_lr: 1.0e-4
    adapter_lr: 1.0e-4
    target_adapter_lr: 1.0e-4

inference:
  scheduler: ddim
  num_steps: 2
  ensemble_size: 1

evaluation:
  protocol: synthetic_closed_set
  ignore_label: 255
  num_classes: 3
  vocabulary:
    source: inline
    dataset: synthetic
    expected_num_classes: 3
    class_names: [background, object_a, object_b]
  query:
    mode: closed_set_all_classes
    prompt_template: "segmentation mask of {class_name}"
    batch_size: 3
